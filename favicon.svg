<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Obsidian Base Frame -->
  <rect width="64" height="64" rx="14" fill="#0B0F17" stroke="url(#cyberGrad)" stroke-width="2.5"/>
  
  <!-- Subtle Internal Orbit Accent -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Bold HS Monogram -->
  <text x="32" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Space Grotesk', sans-serif" font-weight="800" font-size="25" fill="#38BDF8" text-anchor="middle" letter-spacing="0.5" filter="url(#glow)">HS</text>
  
  <!-- Online Pulse Beacon -->
  <circle cx="52" cy="12" r="3" fill="#34D399"/>
</svg>
